<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ФОТОГРАФ | Контакты</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #C6D8E3; color: #0A2463; line-height: 1.5; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
    .header { background-color: #FFFFFF; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(10,36,99,0.05); padding: 16px 0; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .logo { font-size: 1.8rem; font-weight: 800; color: #0A2463; text-decoration: none; }
    .logo span { color: #FF5E00; }
    .nav-menu { display: flex; gap: 32px; list-style: none; }
    .nav-menu a { text-decoration: none; font-weight: 600; color: #3E6680; transition: color 0.2s; }
    .nav-menu a.active { color: #FF5E00; border-bottom: 2px solid #FF5E00; padding-bottom: 4px; }
    .nav-menu a:hover { color: #0A2463; }
    .profile-avatar { background: #0A2463; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; color: white; cursor: default; }
    .menu-toggle { display: none; font-size: 1.6rem; color: #0A2463; cursor: pointer; }
    .section { padding: 80px 0; background-color: #FFFFFF; }
    .section-title { font-size: 2rem; font-weight: 700; margin-bottom: 48px; border-left: 6px solid #FF5E00; padding-left: 18px; text-align: center; border-left: none; }
    .contact-grid { display: flex; gap: 48px; flex-wrap: wrap; }
    .contact-info { flex: 1; background: #F8FAFC; padding: 32px; border-radius: 24px; }
    .contact-info p { margin: 24px 0; display: flex; align-items: center; gap: 16px; font-size: 1.05rem; }
    .contact-info i { width: 32px; color: #0A2463; font-size: 1.3rem; }
    .social-links { display: flex; gap: 24px; margin-top: 32px; }
    .social-links a { color: #3E6680; font-size: 2rem; transition: color 0.2s; }
    .social-links a:hover { color: #0A2463; }
    .contact-form { flex: 1; background: #F8FAFC; padding: 32px; border-radius: 24px; }
    .form-group { margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 14px 18px; border-radius: 16px; border: 1px solid #BCCCD9; font-family: inherit; background: white; }
    button[type="submit"] { background-color: #0A2463; color: white; border: none; padding: 14px 32px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
    button[type="submit"]:hover { background-color: #FF5E00; }
    .map { margin-top: 48px; border-radius: 24px; overflow: hidden; }
    .footer { background-color: #0A2463; color: #C6D8E3; text-align: center; padding: 32px 0; margin-top: 40px; }
    @media (max-width: 768px) {
      .header-inner { flex-direction: column; gap: 16px; }
      .menu-toggle { display: block; }
      .nav-menu { display: none; width: 100%; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px; }
      .nav-menu.show { display: flex; }
      .section-title { font-size: 1.5rem; }
      .contact-info p { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">ФОТО<span>ГРАФ</span></a>
    <div class="menu-toggle" id="mobile-menu"><i class="fas fa-bars"></i></div>
    <ul class="nav-menu" id="nav-links">
      <li><a href="index.html">Портфолио</a></li>
      <li><a href="services.html">Услуги</a></li>
      <li><a href="blog.html">Блог</a></li>
      <li><a href="contact.html" class="active">Контакты</a></li>
    </ul>
    <div class="profile-avatar">А</div>
  </div>
</header>
<main>
  <div class="container">
    <h2 class="section-title">Свяжитесь со мной</h2>
    <div class="contact-grid">
      <div class="contact-info">
        <p><i class="fas fa-phone-alt"></i> +7 (912) 345-67-89</p>
        <p><i class="fas fa-envelope"></i> hello@annasvetlova.com</p>
        <p><i class="fas fa-map-marker-alt"></i> г. Пенза, ул. Московская, 12, студия «Свет»</p>
        <div class="social-links">
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-vk"></i></a>
          <a href="#"><i class="fab fa-telegram"></i></a>
        </div>
      </div>
      <div class="contact-form">
        <form id="callback-form">
          <div class="form-group"><input type="text" placeholder="Ваше имя" required></div>
          <div class="form-group"><input type="email" placeholder="E-mail" required></div>
          <div class="form-group"><input type="tel" placeholder="Номер телефона"></div>
          <div class="form-group"><textarea rows="4" placeholder="Сообщение или дата съёмки..."></textarea></div>
          <button type="submit">Отправить заявку</button>
        </form>
      </div>
    </div>
    <div class="map">
      <iframe src="https://yandex.ru/map-widget/v1/?um=constructor%3A6b6c8a9b5c4d2f2e1a3b5c7d9e0f1a2b3c4d5e6f7g8h9i0j&source=constructor" width="100%" height="300" frameborder="0" style="border-radius: 24px;"></iframe>
    </div>
  </div>
</main>
<footer class="footer"><div class="container"><p>© 2025 Фотограф «PHOTOSTORY» — Портфолио профессионального фотографа</p></div></footer>
<script>
  const mobileBtn = document.getElementById('mobile-menu'); const navLinks = document.getElementById('nav-links');
  if(mobileBtn) { mobileBtn.addEventListener('click', () => { navLinks.classList.toggle('show'); }); }
  const form = document.getElementById('callback-form');
  if(form) { form.addEventListener('submit', (e) => { e.preventDefault(); alert('Спасибо! Ваша заявка отправлена. Я свяжусь с вами в ближайшее время.'); form.reset(); }); }
</script>
</body>
</html>
